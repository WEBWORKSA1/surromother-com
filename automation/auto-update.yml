# Daily news refresh for SurroMother.com.
# To enable: copy this file to .github/workflows/auto-update.yml in the repository
# (Add file > Create new file > name it .github/workflows/auto-update.yml > paste > Commit).
name: Daily news refresh
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh surrogacy news
        run: python automation/fetch_news.py
      - name: Commit if the news changed
        run: |
          git config user.name "surromother-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/news.json
          if git diff --cached --quiet; then echo "No news changes"; else git commit -m "Daily news refresh" && git push; fi
      - name: Rebuild GitHub Pages (rolls dates, sitemap and news)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
